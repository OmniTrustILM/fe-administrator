name: Check PR
on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.x
      - name: Test build
        run: |
          npm ci --ignore-scripts
          npm run lint
          npm run typecheck
          npm run build

      # Package up PR context for downstream workflow_run
      - name: Prepare PR context artifact
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          jq -n \
            --arg pr_number   "$PR_NUMBER" \
            --arg head_sha    "$HEAD_SHA" \
            --arg head_repo   "$HEAD_REPO" \
            --arg head_branch "$HEAD_BRANCH" \
            --arg base_ref    "$BASE_REF" \
            '{pr_number: $pr_number, head_sha: $head_sha, head_repo: $head_repo, head_branch: $head_branch, base_ref: $base_ref}' \
            > pr-context.json
          cat pr-context.json

      - name: Upload PR context
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-context
          path: pr-context.json
          retention-days: 1
          if-no-files-found: error
