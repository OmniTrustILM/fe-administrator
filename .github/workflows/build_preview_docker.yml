name: Build Preview Docker image

on:
  workflow_dispatch:
    inputs:
      pr_number:   { description: "PR number", required: true }
      head_sha:    { description: "Head commit SHA", required: true }
      head_repo:   { description: "Fork repo full_name", required: true }
      head_branch: { description: "Fork branch", required: true }
      # Nothing here reads base_ref, but dispatch-preview-docker.yml still sends
      # it and createWorkflowDispatch rejects undeclared inputs, so the
      # declaration stays for dispatch-payload compatibility.
      base_ref:    { description: "Base branch (unused; kept for dispatch compatibility)", required: false }

# What appears in the Actions list
run-name: >-
  Docker Preview • PR #${{ inputs.pr_number }}
  • ${{ inputs.head_repo }}@${{ inputs.head_branch }}
  • ${{ inputs.head_sha }}

# One in-flight preview build per PR; a newer push supersedes an older build.
concurrency:
  group: preview-docker-pr-${{ github.event.inputs.pr_number }}
  cancel-in-progress: true

permissions: {}

env:
  REGISTRY: hub.omnitrustregistry.com
  # Previews live in their own project, pushed by a robot scoped to it, so a
  # build of unreviewed fork code can never write next to the release tags.
  IMAGE_PATH: ilm-preview/frontend-administrator
  PREVIEW_TAG: pr-${{ inputs.pr_number }}-${{ inputs.head_sha }}
  # Base cache namespace. Each arch appends its own suffix so the two builds
  # do not overwrite one another's layers.
  CACHE_SCOPE: frontend-administrator-preview

jobs:
  # Create the GitHub check once, and reuse the check_id in other jobs
  create_check:
    name: Create GitHub Check
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      check_id: ${{ steps.create_check.outputs.check_id }}
    steps:
      - name: Generate token
        id: app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.SONAR_GH_APP_ID }}
          private-key: ${{ secrets.SONAR_GH_APP_PRIVATE_KEY }}

      - name: Create GitHub Check (in_progress)
        id: create_check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          HEAD_SHA: ${{ inputs.head_sha }}
        with:
          github-token: ${{ steps.app_token.outputs.token }}
          script: |
            const check = await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: `Docker preview build`,
              head_sha: process.env.HEAD_SHA,
              status: "in_progress"
            });
            core.setOutput("check_id", check.data.id);

  build:
    name: Build ${{ matrix.arch }} • PR #${{ inputs.pr_number }}
    runs-on: ${{ matrix.runner }}
    needs: [create_check]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      # Check out the exact commit PREVIEW_TAG names, so the image content always
      # matches the tag even if the branch moved on after the dispatch.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: ${{ inputs.head_repo }}
          ref: ${{ inputs.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to the preview registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.PREVIEW_REGISTRY_USERNAME }}
          password: ${{ secrets.PREVIEW_REGISTRY_PASSWORD }}

      - name: Build + push (${{ matrix.arch }}) by digest only (no tags)
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          # Push without creating an extra tag
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_PATH }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ env.CACHE_SCOPE }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ env.CACHE_SCOPE }}-${{ matrix.arch }}

      # A matrix cannot expose one output per arch, so each build drops its
      # digest as a filename for the manifest job to collect.
      - name: Export digest as marker file
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p "${{ runner.temp }}/digests"
          touch "${{ runner.temp }}/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish_manifest:
    name: Publish multiarch manifest • PR #${{ inputs.pr_number }}
    runs-on: ubuntu-latest
    needs: [create_check, build]
    permissions:
      # Read the per-arch digest artifacts produced earlier in this run.
      actions: read
    steps:
      - name: Download per-arch digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Log in to the preview registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.PREVIEW_REGISTRY_USERNAME }}
          password: ${{ secrets.PREVIEW_REGISTRY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Create + push multiarch manifest (single tag)
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_PATH }}
        run: |
          set -euo pipefail

          echo "Per-arch digest files:"
          ls -1

          SOURCES=()
          for digest_file in *; do
            SOURCES+=("${IMAGE}@sha256:${digest_file}")
          done

          docker buildx imagetools create \
            --tag "${IMAGE}:${PREVIEW_TAG}" \
            "${SOURCES[@]}"

          docker buildx imagetools inspect "${IMAGE}:${PREVIEW_TAG}"

      - name: Generate token (for check update)
        id: app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.SONAR_GH_APP_ID }}
          private-key: ${{ secrets.SONAR_GH_APP_PRIVATE_KEY }}

      - name: Mark GitHub Check as success
        if: success()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CHECK_ID: ${{ needs.create_check.outputs.check_id }}
        with:
          github-token: ${{ steps.app_token.outputs.token }}
          script: |
            await github.rest.checks.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              check_run_id: Number(process.env.CHECK_ID),
              status: "completed",
              conclusion: "success"
            });

  # Cancellation is not a failure(), so gate on both — otherwise a superseded
  # run leaves the check stuck at in_progress forever.
  finalize_check:
    name: Finalize Check (failure or cancellation)
    runs-on: ubuntu-latest
    needs: [create_check, build, publish_manifest]
    permissions: {}
    if: ${{ failure() || cancelled() }}
    steps:
      - name: Generate token
        id: app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.SONAR_GH_APP_ID }}
          private-key: ${{ secrets.SONAR_GH_APP_PRIVATE_KEY }}

      - name: Close the GitHub Check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CHECK_ID: ${{ needs.create_check.outputs.check_id }}
          CONCLUSION: ${{ cancelled() && 'cancelled' || 'failure' }}
        with:
          github-token: ${{ steps.app_token.outputs.token }}
          script: |
            if (!process.env.CHECK_ID) {
              core.info("No check was created, nothing to finalize.");
              return;
            }
            await github.rest.checks.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              check_run_id: Number(process.env.CHECK_ID),
              status: "completed",
              conclusion: process.env.CONCLUSION
            });
