name: Build Preview Docker image

on:
  workflow_dispatch:
    inputs:
      pr_number:   { description: "PR number", required: true }
      head_sha:    { description: "Head commit SHA", required: true }
      head_repo:   { description: "Fork repo full_name", required: true }
      head_branch: { description: "Fork branch", required: true }
      base_ref:    { description: "Base branch", required: true }

# What appears in the Actions list
run-name: >-
  Docker Preview • PR #${{ inputs.pr_number }}
  • ${{ inputs.head_repo }}@${{ inputs.head_branch }}
  • ${{ inputs.head_sha }}

permissions: {}

env:
  REGISTRY: hub.omnitrustregistry.com
  IMAGE: hub.omnitrustregistry.com/ilm/frontend-administrator
  PREVIEW_TAG: pr-${{ inputs.pr_number }}-${{ inputs.head_sha }}
  # Base cache namespace. Each arch appends its own suffix so the two builds
  # do not overwrite one another's layers.
  CACHE_SCOPE: frontend-administrator-preview

jobs:
  # Create the GitHub check once, and reuse the check_id in other jobs
  create_check:
    name: Create GitHub Check
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      check_id: ${{ steps.create_check.outputs.check_id }}
    steps:
      - name: Generate token
        id: app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.SONAR_GH_APP_ID }}
          private-key: ${{ secrets.SONAR_GH_APP_PRIVATE_KEY }}

      - name: Create GitHub Check (in_progress)
        id: create_check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          HEAD_SHA: ${{ inputs.head_sha }}
        with:
          github-token: ${{ steps.app_token.outputs.token }}
          script: |
            const check = await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: `Docker preview build`,
              head_sha: process.env.HEAD_SHA,
              status: "in_progress"
            });
            core.setOutput("check_id", check.data.id);

  build_amd64:
    name: Build amd64 • PR #${{ inputs.pr_number }}
    runs-on: ubuntu-latest
    needs: [create_check]
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      # Check out the exact commit PREVIEW_TAG names, so the image content always
      # matches the tag even if the branch moved on after the dispatch.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: ${{ inputs.head_repo }}
          ref: ${{ inputs.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to the registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.CONTAINER_REGISTRY_USERNAME }}
          password: ${{ secrets.CONTAINER_REGISTRY_PASSWORD }}

      - name: Build + push (amd64) by digest only (no tags)
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          # Push without creating an extra tag
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ env.CACHE_SCOPE }}-amd64
          cache-to: type=gha,mode=max,scope=${{ env.CACHE_SCOPE }}-amd64

  build_arm64:
    name: Build arm64 • PR #${{ inputs.pr_number }}
    runs-on: ubuntu-24.04-arm
    needs: [create_check]
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: ${{ inputs.head_repo }}
          ref: ${{ inputs.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to the registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.CONTAINER_REGISTRY_USERNAME }}
          password: ${{ secrets.CONTAINER_REGISTRY_PASSWORD }}

      - name: Build + push (arm64) by digest only (no tags)
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ env.CACHE_SCOPE }}-arm64
          cache-to: type=gha,mode=max,scope=${{ env.CACHE_SCOPE }}-arm64

  publish_manifest:
    name: Publish multiarch manifest • PR #${{ inputs.pr_number }}
    runs-on: ubuntu-latest
    needs: [create_check, build_amd64, build_arm64]
    permissions: {}
    steps:
      - name: Log in to the registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.CONTAINER_REGISTRY_USERNAME }}
          password: ${{ secrets.CONTAINER_REGISTRY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Create + push multiarch manifest (single tag)
        env:
          AMD_DIGEST: ${{ needs.build_amd64.outputs.digest }}
          ARM_DIGEST: ${{ needs.build_arm64.outputs.digest }}
        run: |
          set -euo pipefail

          echo "amd64 digest: ${AMD_DIGEST}"
          echo "arm64 digest: ${ARM_DIGEST}"

          docker buildx imagetools create \
            --tag "${IMAGE}:${PREVIEW_TAG}" \
            "${IMAGE}@${AMD_DIGEST}" \
            "${IMAGE}@${ARM_DIGEST}"

          docker buildx imagetools inspect "${IMAGE}:${PREVIEW_TAG}"

      - name: Generate token (for check update)
        id: app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.SONAR_GH_APP_ID }}
          private-key: ${{ secrets.SONAR_GH_APP_PRIVATE_KEY }}

      - name: Mark GitHub Check as success
        if: success()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CHECK_ID: ${{ needs.create_check.outputs.check_id }}
        with:
          github-token: ${{ steps.app_token.outputs.token }}
          script: |
            await github.rest.checks.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              check_run_id: Number(process.env.CHECK_ID),
              status: "completed",
              conclusion: "success"
            });

  finalize_check_failure:
    name: Finalize Check (failure)
    runs-on: ubuntu-latest
    needs: [create_check, build_amd64, build_arm64, publish_manifest]
    permissions: {}
    if: failure()
    steps:
      - name: Generate token
        id: app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.SONAR_GH_APP_ID }}
          private-key: ${{ secrets.SONAR_GH_APP_PRIVATE_KEY }}

      - name: Mark GitHub Check as failure
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CHECK_ID: ${{ needs.create_check.outputs.check_id }}
        with:
          github-token: ${{ steps.app_token.outputs.token }}
          script: |
            await github.rest.checks.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              check_run_id: Number(process.env.CHECK_ID),
              status: "completed",
              conclusion: "failure"
            });
