name: OpenAPI generation
on:
  pull_request:
    branches: [ main ]
    paths:
      - openapitools.json
      - openapi-generator/**
      - scripts/*openapi*
      - scripts/fixtures/openapi-version-churn/**
      - src/types/openapi/.openapi-generator-ignore
      - package.json
      - package-lock.json
      - biome.json
      - .github/workflows/openapi_generation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version-churn:
    name: Version-only regeneration
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.x
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Check that a version bump only changes API_VERSION
        run: npm run check:openapi-generation
