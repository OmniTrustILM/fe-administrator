name: Test Docker image

on:
  pull_request:
    branches: [ main*, feat/*, hotfix/* ]
  workflow_dispatch:

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}-docker-test
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  test:
    # Tracks @main by design: this is a first-party OmniTrustILM reusable workflow and
    # edits to it are meant to reach every repo without a bump here. Sonar's "use a full
    # commit SHA" rule targets third-party actions and is accepted for this reference.
    uses: OmniTrustILM/.github/.github/workflows/containers-test.yml@main
    with:
      image: ilm/frontend-administrator
      cache-scope: frontend-administrator
      build-args: |
        VERSION=${{ github.ref_name }}
