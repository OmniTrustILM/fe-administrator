name: Sonar
on:
  workflow_dispatch:
    inputs:
      pr_number:   { description: "PR number", required: true }
      head_sha:    { description: "Head commit SHA", required: true }
      head_repo:   { description: "Fork repo full_name", required: true }
      head_branch: { description: "Fork branch", required: true }
      base_ref:    { description: "Base branch", required: true }
      run_id:      { description: "Tests run ID", required: true }

# What appears in the Actions list
run-name: >-
  Sonar • PR #${{ inputs.pr_number }}
  • ${{ inputs.head_repo }}@${{ inputs.head_branch }}
  • ${{ inputs.head_sha }}

# One analysis per PR at a time: two dispatches for quick successive pushes
# could otherwise race, and the last to finish would report a stale commit.
concurrency:
  group: sonar-pr-${{ inputs.pr_number }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read # download the coverage artifacts from the Tests run
  pull-requests: read

# The analysis only scans: the tests and their coverage come from the Tests
# run, so this job installs, builds and runs nothing from the PR.

jobs:
  sonar:
    name: Sonar • PR #${{ inputs.pr_number }}
    runs-on: ubuntu-latest

    steps:
      # Validate every input against a strict pattern, then verify the whole
      # tuple against the GitHub API. Later steps use the API-sourced outputs,
      # never the raw inputs.
      - name: Verify and sanitize dispatch context
        id: ctx
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          IN_PR_NUMBER: ${{ inputs.pr_number }}
          IN_HEAD_SHA: ${{ inputs.head_sha }}
          IN_HEAD_REPO: ${{ inputs.head_repo }}
          IN_HEAD_BRANCH: ${{ inputs.head_branch }}
          IN_BASE_BRANCH: ${{ inputs.base_ref }}
          IN_RUN_ID: ${{ inputs.run_id }}
        with:
          script: |
            const fail = (msg) => { core.setFailed(msg); throw new Error(msg); };
            const pat = {
              num:    /^[0-9]+$/,
              sha:    /^[0-9a-f]{40}$/,
              repo:   /^[A-Za-z0-9_.][A-Za-z0-9_.-]*\/[A-Za-z0-9_.][A-Za-z0-9_.-]*$/,
            };
            const inp = {
              prNumber:   process.env.IN_PR_NUMBER,
              headSha:    process.env.IN_HEAD_SHA,
              headRepo:   process.env.IN_HEAD_REPO,
              headBranch: process.env.IN_HEAD_BRANCH,
              baseRef:    process.env.IN_BASE_BRANCH,
              runId:      process.env.IN_RUN_ID,
            };
            if (!pat.num.test(inp.prNumber))      fail('bad pr_number');
            if (!pat.sha.test(inp.headSha))       fail('bad head_sha');
            if (!pat.repo.test(inp.headRepo))     fail('bad head_repo');
            if (!pat.num.test(inp.runId))         fail('bad run_id');

            const run = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner, repo: context.repo.repo,
              run_id: Number(inp.runId),
            });
            if (run.data.path !== '.github/workflows/tests.yml') fail('run_id is not a Tests run');
            if (run.data.event !== 'pull_request') fail('Tests run was not a pull_request run');
            if (run.data.conclusion !== 'success') fail('Tests run did not succeed');
            if (run.data.head_sha !== inp.headSha) fail('head_sha does not match the Tests run');
            const runHeadRepo = run.data.head_repository && run.data.head_repository.full_name;
            if (runHeadRepo !== inp.headRepo) fail('head_repo does not match the Tests run');

            const pr = await github.rest.pulls.get({
              owner: context.repo.owner, repo: context.repo.repo,
              pull_number: Number(inp.prNumber),
            });
            // The run and the PR are bound by the same head sha and repo on both
            // sides; run.data.pull_requests is empty for fork PRs.
            if (pr.data.head.sha !== inp.headSha) fail('PR head sha mismatch');
            if (pr.data.head.repo.full_name !== inp.headRepo) fail('PR head repo mismatch');
            // Branch names are matched against the PR rather than a pattern, so
            // any valid Git ref is accepted. A ref holds no whitespace or control
            // characters, which keeps it one scanner argument and one GITHUB_ENV line.
            if (pr.data.head.ref !== inp.headBranch) fail('head_branch does not match PR');
            if (pr.data.base.ref !== inp.baseRef) fail('base_ref does not match PR base');
            if (pr.data.base.ref !== 'main') fail('base ref is not main');

            core.setOutput('pr_number',   String(pr.data.number));
            core.setOutput('run_id',      String(run.data.id));
            core.setOutput('head_sha',    pr.data.head.sha);
            core.setOutput('head_repo',   pr.data.head.repo.full_name);
            core.setOutput('head_branch', pr.data.head.ref);
            core.setOutput('base_ref',    pr.data.base.ref);

      # API-sourced, pattern-validated values only; git refs cannot contain
      # whitespace or newlines, so the GITHUB_ENV write cannot inject.
      - name: Export verified context
        env:
          V_PR_NUMBER: ${{ steps.ctx.outputs.pr_number }}
          V_HEAD_SHA: ${{ steps.ctx.outputs.head_sha }}
          V_HEAD_REPO: ${{ steps.ctx.outputs.head_repo }}
          V_PR_BRANCH: ${{ steps.ctx.outputs.head_branch }}
          V_BASE_BRANCH: ${{ steps.ctx.outputs.base_ref }}
        run: |
          {
            echo "PR_NUMBER=$V_PR_NUMBER"
            echo "HEAD_SHA=$V_HEAD_SHA"
            echo "HEAD_REPO=$V_HEAD_REPO"
            echo "PR_BRANCH=$V_PR_BRANCH"
            echo "BASE_BRANCH=$V_BASE_BRANCH"
          } >> "$GITHUB_ENV"

      - name: Generate token
        id: app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.SONAR_GH_APP_ID }}
          private-key: ${{ secrets.SONAR_GH_APP_PRIVATE_KEY }}
          # The check steps are all this token is for.
          permission-checks: write

      - name: Create GitHub Check (in_progress)
        id: create_check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ steps.app_token.outputs.token }}
          script: |
            const check = await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: `SonarQube Analysis`,
              head_sha: process.env.HEAD_SHA,
              status: "in_progress"
            });
            core.setOutput("check_id", check.data.id);

      # The coverage artifacts are PR-produced, so they stay outside the
      # workspace.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-vitest
          path: ${{ runner.temp }}/coverage/vitest
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.ctx.outputs.run_id }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-playwright
          path: ${{ runner.temp }}/coverage/playwright
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.ctx.outputs.run_id }}

      - name: Check the coverage reports
        run: |
          for f in "$RUNNER_TEMP/coverage/vitest/lcov.info" "$RUNNER_TEMP/coverage/playwright/lcov.info"; do
            if [ ! -f "$f" ] || [ -L "$f" ]; then
              echo "::error::Coverage report missing or not a regular file: $f"
              exit 1
            fi
          done

      # The verified commit, not the movable branch ref.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: ${{ env.HEAD_REPO }}
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false

      # The base goes into a local branch: the scanner resolves the PR target
      # from refs/heads before refs/remotes/origin, which for a fork PR holds
      # the fork's own branch. The quality policy (exclusions) always comes
      # from the base branch, not from the PR under analysis.
      - name: Fetch base branch and pin sonar-project.properties to base
        env:
          UPSTREAM_URL: ${{ github.event.repository.clone_url }}
        run: |
          git remote add upstream "$UPSTREAM_URL"
          git fetch upstream "+refs/heads/${BASE_BRANCH}:refs/heads/${BASE_BRANCH}"
          git checkout "refs/heads/${BASE_BRANCH}" -- sonar-project.properties

      # The report paths are set here rather than read from
      # sonar-project.properties, because the reports live outside the
      # workspace.
      - name: Sonar Scan
        uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2 # v7.2.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN:  ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.javascript.lcov.reportPaths=${{ runner.temp }}/coverage/playwright/lcov.info,${{ runner.temp }}/coverage/vitest/lcov.info
            -Dsonar.scm.revision=${{ env.HEAD_SHA }}
            -Dsonar.pullrequest.key=${{ env.PR_NUMBER }}
            -Dsonar.pullrequest.branch=${{ env.PR_BRANCH }}
            -Dsonar.pullrequest.base=${{ env.BASE_BRANCH }}

      - name: Finalize GitHub Check
        if: always()
        # Non-fatal: a failed check update must not flip a successful scan.
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CHECK_ID: ${{ steps.create_check.outputs.check_id }}
          JOB_STATUS: ${{ job.status }}
        with:
          github-token: ${{ steps.app_token.outputs.token }}
          script: |
            const checkId = process.env.CHECK_ID;
            const status = process.env.JOB_STATUS;
            const conclusions = { success: "success", failure: "failure", cancelled: "cancelled" };
            const conclusion = conclusions[status] || "failure";
            await github.rest.checks.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              check_run_id: checkId,
              completed_at: new Date().toISOString(),
              status: "completed",
              conclusion,
              output: {
                title: "SonarQube Analysis Result",
                summary: `✅ SonarQube analysis concluded with status: **${conclusion}**`,
              }
            });
