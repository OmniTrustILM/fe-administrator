<!doctype html>
<html lang="en">
    <head>
        <script>
            // Canonicalise to trailing-slash form before any relative resource is fetched,
            // so ./config.js and ./assets/* resolve against the correct base regardless of
            // whether the user entered the app with or without a trailing slash.
            // Skip when the last path segment looks like a file (contains a dot) so
            // direct hits to /index.html or similar file URLs aren't redirected to a 404.
            if (!location.pathname.endsWith('/') && !location.pathname.split('/').pop().includes('.')) {
                location.replace(location.pathname + '/' + location.search + location.hash);
            }
        </script>
        <script>
            // Apply the stored theme before first paint so dark-mode users never see a white flash.
            // Mirrors utils/theme.ts; it cannot import from it because no module has loaded yet.
            (function () {
                // Start from the operating system preference, then let an explicit stored choice
                // override it. Reading storage can throw outright when storage is blocked, so the
                // system preference is resolved first and remains the fallback in that case.
                var prefersDark = globalThis.matchMedia && globalThis.matchMedia('(prefers-color-scheme: dark)').matches;
                var resolved = prefersDark ? 'dark' : 'light';
                try {
                    var stored = localStorage.getItem('theme-mode');
                    if (stored === 'light' || stored === 'dark') {
                        resolved = stored;
                    }
                } catch {
                    // Storage unavailable; the system preference resolved above stands.
                }
                document.documentElement.classList.toggle('dark', resolved === 'dark');
                document.documentElement.style.colorScheme = resolved;
            })();
        </script>
        <script type="text/javascript" src="./config.js"></script>
        <meta charset="utf-8" />
        <link rel="icon" href="./ot-sign-color.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.svg" />
        <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.svg" />
        <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.svg" />
        <link rel="manifest" href="./manifest.json" />
        <link rel="mask-icon" href="./ot-sign-color.svg" color="#5bbad5" />
        <meta name="msapplication-TileColor" content="#da532c" />
        <meta name="theme-color" content="#ffffff" />
        <meta name="description" content="ILM" />
        <title>ILM</title>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
        <script type="module" src="./src/index.tsx"></script>
    </body>
</html>
